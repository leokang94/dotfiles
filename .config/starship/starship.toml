format = """
$os\
$username\
$directory\
$git_branch\
$git_status\
$fill\
$lua\
$nodejs\
${custom.yarn}\
$jobs\
$cmd_duration\
$line_break\
$character"""


[fill]
symbol = ' '

[username]
style_user = "bright-yellow bold italic"
style_root = "purple bold italic"
format = "[🦁]($style) "
disabled = false
show_always = true


[character]
success_symbol = '[\$](bold green)'

[battery]
format = "[ $percentage $symbol]($style)"
full_symbol = "█"
charging_symbol = "[↑](italic bold green)"
discharging_symbol = "↓"
unknown_symbol = "░"
empty_symbol = "▃"

[[battery.display]]
threshold = 20
style = "italic bold red"

[[battery.display]]
threshold = 60
style = "italic dimmed bright-purple"

[[battery.display]]
threshold = 70
style = "italic dimmed yellow"

[memory_usage]
symbol = "󰍛 "
disabled = false

[directory]
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = false
read_only = " 󰌾"

[cmd_duration]
format = '\[[⌛$duration]($style)\]'

[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style) "
symbol = " "

[git_commit]
tag_symbol = '  '

[nodejs]
format = "[$symbol($version )]($style)"
symbol = " "

[custom.yarn]
command = "yarn -v"
description = "yarn version"
require_repo = true
detect_files = ["yarn.lock", ".yarnrc.yml", ".pnp.cjs", ".pnp.loader.mjs"]
detect_folders = [".yarn"]
style = "bold purple"
format = '[$symbol($output )]($style)'
symbol = " "

# default nerd font styles

[aws]
format = '[$symbol($profile )(\($region\) )(\[$duration\] )]($style)'
symbol = "  "

